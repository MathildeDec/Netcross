# .github/workflows/docs.yml -- construction et publication de la
# documentation MkDocs (issue #282).
#
# - PR/push : mkdocs build --strict (bloquant sur lien mort)
# - main uniquement : publication vers GitHub Pages

name: Documentation

"on":
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Construction (mkdocs build --strict)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du depot
        uses: actions/checkout@v7

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Installation de mkdocs-material
        run: pip install mkdocs-material pymdown-extensions

      - name: Construction (strict -- echoue sur lien mort)
        run: mkdocs build --strict

      - name: Upload de l'artefact (site HTML)
        uses: actions/upload-artifact@v4
        with:
          name: mkdocs-site
          path: site/

  deploy:
    name: Publication GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout du depot
        uses: actions/checkout@v7

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Installation de mkdocs-material
        run: pip install mkdocs-material pymdown-extensions

      - name: Construction
        run: mkdocs build --strict

      - name: Upload GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Déploiement GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
