[pytest]
# "." en plus de "src" : necessaire depuis #138 (Job CVE-4) pour importer
# scripts/import_nvd.py comme un module Python normal depuis les tests
# (tests/test_cve_correlation.py), sans dupliquer sa logique de parsing.
# Les CLI historiques (src/cross_capture_*.py) n'en ont jamais eu besoin
# car elles vivent deja dans "src", couvert par l'entree existante.
pythonpath = src .
testpaths = tests
